<!doctype html>
<html lang="pt-BR">

<head>
  <meta charset="utf-8">
  <title>Página não encontrada</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
      color: #e2e8f0;
    }

    .wrapper {
      width: 100%;
      max-width: 520px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 16px;
      background: rgba(9, 9, 11, 0.92);
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(16, 185, 129, 0.12);
    }

    h1 {
      color: #6ee7b7;
      font-size: clamp(1.6rem, 4.5vw, 2rem);
      margin-bottom: 10px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border: 1px solid rgba(52, 211, 153, 0.5);
      border-radius: 10px;
      color: #a7f3d0;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
    }

    a:hover {
      background: rgba(16, 185, 129, 0.12);
    }
  </style>
</head>

<body>
  <main class="wrapper">
    <h1>Página não encontrada</h1>
    <p>A rota acessada não existe ou foi removida. Volte para a página inicial para continuar.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>

</html>
